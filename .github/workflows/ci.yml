name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the token is only ever used to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # llama-cpp-python publishes no Linux wheels, so installing it here
      # would compile llama.cpp from source on every run. The package imports
      # it lazily inside model.load(), so the whole suite runs without it.
      # Installing with --no-deps keeps this job to seconds and still
      # exercises the packaging: console script, package discovery, metadata.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --no-deps -e .

      - name: Confirm the console script was installed
        run: never-leaves --help

      # Ubuntu 24.04 restricts unprivileged user namespaces by default and the
      # hosted runners use it. That is exactly the mechanism this project
      # depends on, so lift the restriction where the kernel exposes the knob
      # and the two isolation tests run for real instead of skipping.
      - name: Try to permit unprivileged user namespaces
        run: |
          set -x
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "this kernel exposes no apparmor userns knob"
          fi
          if unshare -rn -- true 2>/dev/null; then
            echo "RESULT: unprivileged user namespaces are available"
          else
            echo "RESULT: not available, the isolation tests will report a skip"
          fi

      - name: Collect the suite
        run: python -m pytest --collect-only -q

      - name: Run the test suite
        run: python -m pytest -q

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # gitleaks walks commits, so a shallow clone would only see the tip.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Scan the full history for committed secrets
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
