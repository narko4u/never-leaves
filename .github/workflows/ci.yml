name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the token is only ever used to read the checkout.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      # llama-cpp-python publishes no Linux wheels, so installing it here
      # would compile llama.cpp from source on every run. The package imports
      # it lazily inside model.load(), so the whole suite runs without it.
      # Installing with --no-deps keeps this job to seconds and still
      # exercises the packaging: console script, package discovery, metadata.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --no-deps -e .

      - name: Confirm the console script was installed
        run: never-leaves --help

      - name: Collect the suite
        run: python -m pytest --collect-only -q

      - name: Run the test suite
        run: python -m pytest -q

      # Two tests assert the no-network guarantee from inside a namespace.
      # They skip themselves when unshare is missing. The runner must also
      # permit unprivileged user namespaces for them to run at all. This step
      # makes that visible instead of silently skipping.
      - name: Report isolation capability
        run: |
          if unshare -rn -- true 2>/dev/null; then
            echo "unprivileged user namespaces: available"
          else
            echo "unprivileged user namespaces: NOT available on this runner"
            echo "the two isolation tests will be skipped or fail here"
          fi

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # gitleaks walks commits, so a shallow clone would only see the tip.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan the full history for committed secrets
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
